name: Build Windows voxl
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 手动触发

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKGRS_TRIPLET: x64-windows-static-md
  ESBUILD: esbuild.cmd

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js for esbuild
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install esbuild
        shell: pwsh
        run: |
          npm install -g esbuild
          esbuild --version | Out-Host

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            if (-not (Test-Path "$env:VCPKG_ROOT")) {
              git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            }
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" version

      - name: Cache vcpkg downloads and installed tree
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: vcpkg-win-x64-static-md-v1

      - name: Install vcpkg packages
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install x264 libyuv opus --triplet x64-windows-static-md

      - name: Install LLVM for bindgen
        id: llvm
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0.6"

      - name: Export LIBCLANG_PATH
        shell: pwsh
        run: |
          $bin = Join-Path "${{ steps.llvm.outputs.llvm-path }}" "bin"
          if (-not (Test-Path (Join-Path $bin "libclang.dll"))) { throw "libclang.dll not found in $bin" }
          "LIBCLANG_PATH=$bin" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          & (Join-Path $bin "clang.exe") --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true

      - name: Build voxl release
        shell: pwsh
        run: |
          cargo build --release
          if (-not (Test-Path "target\release\voxl.exe")) { throw "voxl.exe not built" }
          Get-Item "target\release\voxl.exe" | Select-Object Name, Length

      - name: Upload voxl.exe
        uses: actions/upload-artifact@v4
        with:
          name: voxl-windows-x64
          path: target/release/voxl.exe
          if-no-files-found: error
